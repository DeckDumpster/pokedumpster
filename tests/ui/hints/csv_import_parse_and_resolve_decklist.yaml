start_page: /ingest/csv
involves:
  - "Format select (ManaBox / TCGplayer)"
  - "…or paste CSV text textarea"
  - "Preview button"
  - "preview summary line with matched count"
  - "Matched rows table (Line, Card, Set, #, Variant, Condition)"
  - "Import button with label 'Import N cards'"
fixture_data:
  format: "ManaBox"
  csv: "a ManaBox export with rows resolving to fixture cards (e.g. sv8 Pikachu ex, Magmar)"
  expected_cards: ["Pikachu ex", "Magmar"]
notes: >
  Navigate to /ingest/csv. Select "ManaBox". Paste a valid ManaBox CSV into
  the textarea. Click "Preview". Wait for the preview summary showing the
  matched count and the Matched rows table with resolved card rows. Verify
  the "Import" button becomes enabled and its label reads "Import {n} cards".
