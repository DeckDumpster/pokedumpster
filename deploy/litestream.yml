# Litestream config for the PokeDumpster backup sidecar (pokedumpster-8ch.3).
#
# Continuously replicates EVERY tenant collection database — and the user
# registry — to S3 from this one sidecar. The shared catalog (shared.sqlite) is
# reproducible via `pkdump setup`, lives OUTSIDE tenants/, and is deliberately
# NOT backed up.
#
# The irreplaceable set is therefore TWO things, and both are here: the tenant
# databases, and the table that says whose is whose.
#
# This file is INSTANCE-AGNOSTIC: the S3 target, the tenants directory and the
# registry path come from the environment (set by the Quadlet unit's
# EnvironmentFile), so the single clone can serve every instance. Litestream
# expands ${VARS} by default.
#
# An UNSET variable expands to empty, and Litestream's tolerance for that is not
# uniform — measured, v0.5.16:
#   * an empty `path:` on a db entry is fatal at startup ("must specify either
#     'path' or 'dir'"), which is the good case: an instance whose litestream.env
#     predates the registry entry FAILS LOUDLY instead of quietly backing up only
#     its tenants. `deploy/setup.sh <instance>` backfills the missing keys.
#   * an empty `path:` on a REPLICA is not fatal: it replicates to the bucket
#     ROOT, in silence. So never ship a replica prefix that is a bare variable
#     nobody validates — deploy/litestream-lib.sh hard-fails on an unset one, and
#     deploy/backup-check.sh asks S3 whether the registry is actually fresh.
#
# ── DIRECTORY MODE (pd-fof4) ────────────────────────────────────────────────
# `dir:` + `pattern:` + `watch:` is Litestream 0.5's native N-database mode. It
# discovers the tenant databases itself and DERIVES each replica path from the
# filename — `<LITESTREAM_S3_PATH>/<database_id>.sqlite`. Two consequences, and
# both are the reason this is a directory entry and not a generated list of
# tenants:
#
#   * Adding a tenant is `pkdump tenant create <handle>`, full stop. `watch: true`
#     picks the new file up within ~5s with no config edit and no restart; there
#     is no generator to run and nothing to keep in sync with the filesystem.
#   * Two tenants CANNOT collide on one replica path. Pointing two databases at
#     the same prefix is accepted silently by Litestream and makes a restore hand
#     back the wrong tenant's collection while reporting success — the worst
#     failure available to a data-isolation feature (deep-dives/litestream-multi-db
#     RESULT.md §2). Here the prefix is derived from a filename, and a filename
#     is a `database_id` the registry mints and never reissues — so no two
#     tenants share a prefix, and no later tenant lands on an earlier one's.
#
# The trade-off: this config no longer names any database path, so
# `litestream restore -config <this file> /data/tenants/x.sqlite` FAILS with
# "database not found in config". Point operations address the replica by URL
# instead — deploy/litestream-lib.sh derives it, deploy/RESTORE.md documents it.
#
# `region` is PINNED so Litestream does NOT call s3:GetBucketLocation — the
# backup IAM role deliberately does not grant that action (validated in
# spikes/sqld-attach-namespaces/RESULT.md, "GATE spike").
#
# `endpoint` is empty in production (the AWS SDK resolves the real S3 endpoint
# from the pinned region); tests/litestream/run.sh sets it to a throwaway MinIO.
#
# ── RETENTION ───────────────────────────────────────────────────────────────
# Point-in-time recovery window: daily snapshots kept for 6 months (180 days).
# This is the ONLY backup (no local snapshots) — so the retention IS the recovery
# horizon. Litestream 0.5 durations are h-only (no d/w); 4320h = 180d.
#
# This block MUST stay at the TOP LEVEL. Litestream's snapshot/retention monitors
# are one set per process: the identical block written inside a `dbs:` entry is
# SILENTLY IGNORED and falls back to the 24h default (RESULT.md §1). Every tenant
# therefore shares one cadence and one retention window — per-tenant retention is
# not available from one sidecar, and nothing here should be designed as if it
# were. tests/litestream/run.sh asserts both the placement and that Litestream
# honours it.
snapshot:
  interval: 24h
  retention: 4320h

dbs:
  - dir: ${LITESTREAM_TENANTS_DIR}
    pattern: "*.sqlite"
    watch: true
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: ${LITESTREAM_S3_PATH}
        region: ${LITESTREAM_S3_REGION}
        endpoint: ${LITESTREAM_S3_ENDPOINT}

  # ── THE USER REGISTRY (pd-nd6w) ──────────────────────────────────────────
  # handle -> database_id. It lives at the DATA ROOT, not under tenants/, so
  # the glob above does not and must not reach it: `tenants/*.sqlite` means
  # "one file per tenant" exactly, and that statement is what makes the glob a
  # correct description of the tenant set. The registry is not a tenant, so it
  # is replicated as ITSELF — its own entry, its own prefix.
  #
  # It is irreplaceable in a way even a tenant database is not. Lose it and
  # every tenant file is still present but ANONYMOUS: a directory of opaque
  # database ids with nothing saying whose is whose. That is exactly the DR gap
  # this project cited when it rejected libSQL/sqld (bottomless does not back up
  # the namespace registry, so recovery has to re-declare namespaces before any
  # data will restore). An unreplicated registry would hand that criticism back.
  #
  # A `path:` entry, not a second `dir:` one, because there is exactly one
  # registry and naming it is the point. Two measured consequences (both
  # asserted in tests/litestream/run.sh):
  #
  #   * The file does NOT have to exist yet. registry.sqlite is created lazily
  #     on first use, and no box has one today; Litestream logs `initialized db`
  #     and starts replicating the moment it appears. So this entry is safe to
  #     ship ahead of anything that writes a registry.
  #   * A `path:` replica prefix is used VERBATIM — unlike `dir:` mode, the file
  #     name is NOT appended. So LITESTREAM_S3_REGISTRY_PATH carries the
  #     `.sqlite` itself and addresses one database, not a parent.
  #
  # It sits BESIDE the tenants prefix (`<inst>/registry.sqlite` next to
  # `<inst>/tenants/`), never underneath it — the total-loss procedure lists
  # that parent prefix to enumerate tenants, and a registry inside it would read
  # as one more tenant.
  #
  # Retention/PITR are the top-level `snapshot:` block above, which is
  # PROCESS-GLOBAL: the registry gets the same 180-day window as every tenant,
  # and it could not be given a different one from this sidecar even if we
  # wanted to. Do not write a `snapshot:` block in here — it is accepted and
  # silently ignored (RESULT.md §1).
  - path: ${LITESTREAM_REGISTRY_DB}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: ${LITESTREAM_S3_REGISTRY_PATH}
        region: ${LITESTREAM_S3_REGION}
        endpoint: ${LITESTREAM_S3_ENDPOINT}
