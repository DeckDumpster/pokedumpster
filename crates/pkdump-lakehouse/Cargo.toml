[package]
name = "pkdump-lakehouse"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pkdump-lake-derive"
path = "src/main.rs"

# catalog.prices + catalog.sealed_prices, from raw/, on the kit's Iceberg crate
# (sp-4k7mxi.4). These replace pkdump-lake-build-prices / -verify-prices in the
# Python lake; the timer is switched by the operator once prod is certified.
[[bin]]
name = "pkdump-lake-build-prices"
path = "src/build_prices.rs"

[[bin]]
name = "pkdump-lake-verify-prices"
path = "src/verify_prices.rs"

[dependencies]
pkdump-db.workspace = true
pkdump-derive.workspace = true
pkdump-ingest.workspace = true
pkdump-site.workspace = true
dumpster-kit-derive.workspace = true
dumpster-kit-lake.workspace = true
dumpster-kit-lakehouse.workspace = true
dumpster-kit-iceberg.workspace = true
iceberg.workspace = true
arrow-array.workspace = true
futures.workspace = true
tokio.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true

[dev-dependencies]
# row_identical.rs pulls in pkdump-ingest/tests/support/mod.rs by path, which
# re-exports from pkdump_ingest::test_upstream — that module is gated behind
# the test-support feature and is absent without it.
pkdump-ingest = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
image.workspace = true
zstd.workspace = true
tar.workspace = true
flate2.workspace = true
