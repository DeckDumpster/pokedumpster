# Scenario: Filtering to a type produces a focused or empty result list

# Related: batches_type_filter_bar, batches_detail_back_preserves_filter

description: >
  When I choose "manual_id" from the Type filter on the batches page,
  the table narrows to show only the manual-entry batch "Vintage holo
  entry". When I choose a type with no batches, the table renders with
  no body rows. Switching the filter back to "All" restores the full
  batch list.
