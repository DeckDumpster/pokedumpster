[package]
name = "pkdump-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pkdump"
path = "src/main.rs"

[dependencies]
pkdump-core.workspace = true
pkdump-db.workspace = true
pkdump-ingest.workspace = true
pkdump-lake.workspace = true
pkdump-server.workspace = true
rusqlite.workspace = true
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true
tokio.workspace = true

[dev-dependencies]
# The raw-coverage gate in `data.rs` drives a whole acquisition phase, which
# builds its own upstream clients — so it needs the in-process fake upstream
# to point them at. Test tier only; the feature is off in the binary.
pkdump-ingest = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
