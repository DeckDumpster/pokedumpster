[workspace]
resolver = "2"
members = [
    "crates/pkdump-cli",
    "crates/pkdump-core",
    "crates/pkdump-db",
    "crates/pkdump-ingest",
    "crates/pkdump-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ryan Gantt"]
repository = "https://github.com/DeckDumpster/pokedumpster"

[workspace.dependencies]
# Internal crates
pkdump-core = { path = "crates/pkdump-core" }
pkdump-db = { path = "crates/pkdump-db" }
pkdump-ingest = { path = "crates/pkdump-ingest" }
pkdump-server = { path = "crates/pkdump-server" }

# External — crates opt in via `dep.workspace = true` as tasks need them
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
ts-rs = "10"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
lto = "thin"
