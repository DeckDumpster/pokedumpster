# Scenario: A keyword query filters the collection server-side
#
# Related:
#   issues: [pokedumpster-idf.10]
#   pull_requests: []

description: >
  On the Collection page I can type a Scryfall-style query like "t:fire"
  into the search bar. The list narrows to cards of that energy type —
  Charizard appears, while a Lightning card like Pikachu does not. The
  filtering happens server-side via the query language, not a name
  substring match.
