  collection: "8 sv3pt5 copies registered to Master Set: 151 via binder_click (including the Mew ex hyper rare), so base_owned and master_owned are both > 0"
notes: >
  1. Navigate to /browse/sv3pt5 and wait for the header. 2. Assert a stat
  reading "Base {owned}/{total}" is visible with a non-zero progress bar
  width. 3. Assert a stat reading "Master {owned}/{total}" is visible with a
  non-zero progress bar width. 4. Do not hard-code the counts — the fixture
  registers 8 copies but base_owned counts distinct card numbers; assert the
  format and that owned > 0 and owned <= total. 5. Assert both fills compute
  to --color-progress-fill and neither to --color-accent: these are the same
  figures the /browse tile showed a click earlier, and they used to change
  hue on the way here. 6. Screenshot.
