start_page: /decks
involves:
  - 'inline create form (.newform) with a "New deck name…" input and an "Owner (optional)" input'
  - '"Create" submit button creates the deck and reloads the list'
  - deck grid shows the new deck as a clickable tile linking to /decks/:id
  - deck detail page with a "+ Add cards" button
  - '"+ Add cards" opens the CollectionPicker modal with a search field'
  - 'picker search box placeholder is "Search your collection…"'
  - picker results are checkbox rows that toggle selection
  - '"Add {n} to {deck name}" footer button confirms the selection'
fixture_data:
  deck_name: "Test Deck"
  deck_owner: "Ryan"
  search_term: "Charmander"
notes: >
  1. On /decks, fill in the name "Test Deck" and owner "Ryan", click
  "Create". 2. The new deck appears in the grid — click its tile to open
  the detail page. 3. Click "+ Add cards". 4. In the picker search box,
  type "Charmander" and wait for results. 5. Check a result row to select
  it. 6. Click the "Add {n} to Test Deck" button to confirm. 7. The deck
  detail card table should now show the added card. Done.
