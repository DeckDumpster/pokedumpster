<!-- SVP symbol — flat text-on-black-with-border glyph that overrides
     pokemontcg.io's busier official symbol so SVP and MEP read as a
     visually consistent pair in /browse. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" role="img" aria-label="SVP">
  <rect x="0" y="0" width="96" height="64" fill="#000" />
  <rect x="6" y="6" width="84" height="52" fill="none" stroke="#fff" stroke-width="3" />
  <text
    x="48"
    y="44"
    text-anchor="middle"
    font-family="-apple-system,'Segoe UI','Helvetica Neue',sans-serif"
    font-weight="800"
    font-size="32"
    letter-spacing="2"
    fill="#fff"
  >SVP</text>
</svg>
