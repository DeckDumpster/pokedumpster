[package]
name = "pkdump-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pkdump-core.workspace = true
pkdump-db.workspace = true
rusqlite.workspace = true
axum.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
# Cloudflare Access JWT validation.
jsonwebtoken.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
# Decoders for the compression tests — the assertion that matters is that a
# compressed response decodes back to exactly the uncompressed bytes.
flate2.workspace = true
brotli.workspace = true
# RSA key generation and PEM export for the in-process JWKS test server.
rsa = { version = "0.9", features = ["pem"] }
# Base64url encoding for JWK construction.
base64 = "0.22"
