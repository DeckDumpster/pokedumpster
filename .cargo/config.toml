# Workspace cargo configuration.
#
# TS_RS_EXPORT_DIR fixes the output directory for ts-rs type generation so
# every `#[ts(export)]` struct lands in the SvelteKit project regardless of
# which crate or module it lives in. `relative = true` resolves it against
# the repo root. Regenerate the TypeScript types with `cargo test`.
[env]
TS_RS_EXPORT_DIR = { value = "frontend/src/lib/types", relative = true }

# The kit's manifests name registry = "tailnet" for their internal dependencies, so any
# consumer must define it (the kit's own .cargo/config.toml names the same index). Git-sourced
# kit crates resolve each other by path and never query it.
[registries.tailnet]
index = "sparse+http://ubuntu-mini-0.tailb4a728.ts.net:3000/api/packages/deckdumpster/cargo/"
