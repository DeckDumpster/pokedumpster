[workspace]
resolver = "2"
members = [
    "crates/pkdump-cli",
    "crates/pkdump-core",
    "crates/pkdump-db",
    "crates/pkdump-derive",
    "crates/pkdump-erase",
    "crates/pkdump-ingest",
    "crates/pkdump-lakejobs",
    "crates/pkdump-lakehouse",
    "crates/pkdump-server",
    "crates/pkdump-ship",
    "crates/pkdump-site",
    "crates/pkdump-value-snapshots",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ryan Gantt"]
repository = "https://github.com/DeckDumpster/pokedumpster"

[workspace.dependencies]
# Internal crates
pkdump-core = { path = "crates/pkdump-core" }
pkdump-db = { path = "crates/pkdump-db" }
pkdump-derive = { path = "crates/pkdump-derive" }
pkdump-erase = { path = "crates/pkdump-erase" }
pkdump-ingest = { path = "crates/pkdump-ingest" }
pkdump-server = { path = "crates/pkdump-server" }
pkdump-ship = { path = "crates/pkdump-ship" }
pkdump-site = { path = "crates/pkdump-site" }
pkdump-value-snapshots = { path = "crates/pkdump-value-snapshots" }

# Shared kit (one implementation of the tcgcsv client and of the lakehouse, used by dumpstar
# too). ONE revision for every kit crate: two revisions would put two copies of the
# tenancy kernel in the tree, and `AppPrefix` from one is not the other's.
dumpster-kit-tcgcsv = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-tenancy = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-lake = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-keys = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-ship = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-erase = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-derive = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-lakehouse = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-iceberg = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }
dumpster-kit-oidc = { git = "https://github.com/DeckDumpster/dumpster-kit", rev = "a61dd064d652123274f01ef88c46a50926f64d9c" }

# External — crates opt in via `dep.workspace = true` as tasks need them
anyhow = "1"
iceberg = "0.10.1"
arrow-array = "58"
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ts-rs = "10"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
flate2 = "1"
brotli = "8"
tar = "0.4"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ulid = { version = "3", default-features = false, features = ["std"] }
# Raw landing zone, key custody and the shipper are dumpster-kit's now, with the
# dependencies they were written against (HKDF, AES-GCM, Parquet, the S3 SDK). zstd is
# the archive codec the lakehouse design names for `raw/`, still wanted directly by the
# tests that read it — a different question from HTTP response compression, where
# pkdump-server deliberately stayed on br/gzip (see its `compression()`).
zstd = "0.13"
sha2 = "0.10"
# Cloudflare Access JWT validation (pkdump-server). RS256 verification with
# JWK Set support. Uses the `ring` crypto backend (already in the tree via
# reqwest → rustls), so no new native-code dependency is added.
jsonwebtoken = "9"

[profile.release]
strip = true
lto = "thin"
