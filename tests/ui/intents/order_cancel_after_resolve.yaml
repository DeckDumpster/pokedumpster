# Scenario: Remove a resolved line before committing
#
# Related:
#   issues: []

description: >
  After I add and resolve a card line on the Import order page, I click
  that line's "✕" remove button. The line disappears, the Cards header
  ready count drops back to 0/0, the "No cards on this order yet."
  above." empty message returns, and the "Commit order" button is
  disabled again.
