start_page: /browse/sv3pt5
involves:
  - "div.stats containing two ProgressBar blocks, each classed .stat"
  - "first: label span 'Base {binder.base_owned}/{binder.base_total}'"
  - "second: label span 'Master {binder.master_owned}/{binder.master_total}'"
  - "each renders div.track[role=progressbar] with aria-valuenow/max, and span.fill whose width is the percentage"
  - "both are tone=complete — the green /browse paints the same two figures with (pd-2lk2)"
fixture_data:
