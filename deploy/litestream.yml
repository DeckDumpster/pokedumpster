# Litestream config for the PokeDumpster backup sidecar (pokedumpster-8ch.3).
#
# Continuously replicates the per-user collection DB to S3. The shared catalog
# (shared.sqlite) is reproducible via `pkdump setup` and is NOT backed up.
#
# This file is INSTANCE-AGNOSTIC: the S3 target and DB path come from the
# environment (set by the Quadlet unit's EnvironmentFile), so the single clone
# can serve every instance. Litestream expands ${VARS} in the config by default.
#
# `region` is PINNED so Litestream does NOT call s3:GetBucketLocation — the
# backup IAM role deliberately does not grant that action (validated in
# spikes/sqld-attach-namespaces/RESULT.md, "GATE spike").
# Point-in-time recovery window: daily snapshots kept for 6 months (180 days).
# This is the ONLY backup now (no local snapshots) — so the retention IS the
# recovery horizon. Litestream 0.5 durations are h-only (no d/w); 4320h = 180d.
snapshot:
  interval: 24h
  retention: 4320h

dbs:
  - path: ${LITESTREAM_DB_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_S3_BUCKET}
        path: ${LITESTREAM_S3_PATH}
        region: ${LITESTREAM_S3_REGION}
