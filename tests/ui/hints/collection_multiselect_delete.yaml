  - "per-row checkboxes input in the table"
  - "bulk-action bar with a 'Delete' button"
  - "browser confirm() dialog (auto-accepted by the harness)"
  - "page re-fetches via refresh() after the bulk delete"
fixture_data:
  card_name: "Magmar"
  search_term: "Magmar"
notes: >
  Navigate to /collection. Search for "Magmar" (sv8 #32) to narrow the
  table. Click "Select" to enter multi-select mode. Check the Magmar
