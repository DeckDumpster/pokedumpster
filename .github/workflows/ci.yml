name: CI

# deploy.yml has shipped to prod on every push to master since it was added, with
# nothing gating it. PR #7 merged and deployed without a single test having run in
# CI — the suite existed, but only ever as something a human or a polecat ran by
# hand. This is that gate.
#
# Modelled on deckdumpster's .github/workflows/ci.yml, same box, same runner
# label, so the two repos work the same way.

on:
  pull_request:
    # BASE branches, not head. `[master]` alone meant that every PR an epic opens
    # into its own integration branch got NO CI AT ALL — the event simply never
    # matched, so there was no run to be queued, cancelled or approved.
    #
    # Six PRs (#31-#36, the lakehouse epic) sat like that on 2026-08-13. They read
    # as mergeable because the ruleset's required `test` check only guards master,
    # and an admin bypass reports CLEAN regardless. Two of them had in fact FAILED
    # their only evidence — a hand-run `workflow_dispatch`, which polecats had
    # reached for precisely because nothing else was firing.
    #
    # An epic's children are the reviewable unit (a polecat branch is the PR
    # source), so they have to be gated individually. Gating only the eventual
    # integration -> master PR hides a broken child until the whole epic lands.
    branches:
      - master
      - 'integration/**'
  workflow_dispatch:

# ONE pokedumpster CI run at a time, box-wide.
#
# Rootless Podman keeps a single per-user store, and deploy/ci.sh runs
# `podman image prune` and builds into it. Two concurrent runs sharing that store
# is a real, observed failure: the litestream gate died with a bare `exit 127` and
# an empty log, twice, both times with another deploy/ci.sh running (pd-8gjs).
#
# The group is a constant rather than ${{ github.ref }} — per-ref would still let
# two different PRs collide, which is the case that actually bit. cancel-in-progress
# is false because a queued run should WAIT for the store, not kill the run holding
# it.
#
# What this does NOT cover, so nobody reads it as a guarantee: Gas Town polecats
# run ci.sh outside Actions entirely, and nothing here can see them.
#
# It also does not decide whether deploys wait. There is ONE self-hosted runner for
# this repo, so every job serialises on it regardless of concurrency groups —
# measured 2026-08-09: a Deploy sat `queued` for the ~24 minutes a CI run held the
# runner. deploy.yml keeps its own `deploy-<instance>` group purely to stop two
# deploys of one instance racing; it has no bearing on CI. Accepted deliberately
# while CI and prod share a host (per Ryan, 2026-08-09) — revisit when they are
# split, at which point a second runner is the fix, not a concurrency change.
concurrency:
  group: pokedumpster-ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, rgantt]
    # statuses:write for the final step, which posts this run's result as a COMMIT
    # STATUS. The repo default is read-only (default_workflow_permissions=read), so
    # without this the POST 403s and the belt-and-braces below silently does
    # nothing — the exact failure mode it exists to prevent.
    permissions:
      contents: read
      statuses: write
    # The suite builds a container, drives Playwright over every route at two
    # viewports, and executes two DR drills against a throwaway MinIO. It is not
    # a two-minute job; the default 360m is just too loose to catch a hang.
    timeout-minutes: 60
    env:
      # Rootless podman and `systemctl --user` need this; a non-login runner
      # process does not get it for free.
      XDG_RUNTIME_DIR: /run/user/1000
      # -- Warm Rust build cache -------------------------------------------
      # Measured 2026-08-12: one run compiled 352 crates FOUR times -- cargo test
      # (test profile, 5m18s), cargo clippy (dev profile, 2m11s), and again inside
      # the container image -- while the tests themselves finish in seconds.
      # Nothing was cached, on a runner that persists between runs.
      #
      # !! SAFE ONLY BECAUSE THERE IS EXACTLY ONE RUNNER AND THE `concurrency`
      #    GROUP ABOVE SERIALISES EVERY JOB. Two runs writing one target directory
      #    corrupts builds in ways that present as flaky tests. BEFORE ADDING A
      #    SECOND RUNNER, move to sccache or per-runner target dirs.
      #
      # On /workspaces deliberately: / is the 98 G volume production runs from.
      CARGO_TARGET_DIR: /workspaces/ci-cargo-target
      CARGO_HOME: /workspaces/ci-cargo-home
    steps:
      # fetch-depth: 0 so the PR's base commit is present locally and the
      # changed-path list below can be computed without a second network round
      # trip. The runner is self-hosted and reuses its checkout, so after the
      # first run this is an incremental fetch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tier selection (pd-s2mj). Which tiers ci.sh runs is decided from the
      # paths this PR touched — docs-only runs the lint tier, a change confined
      # to frontend/ runs frontend + container + browser, and ANYTHING ELSE runs
      # the whole suite. deploy/ci-select.sh holds the rule and explains why it
      # is shaped to fail closed.
      #
      # PULL REQUESTS ONLY, and that is the load-bearing part of this step. The
      # `if:` is what makes selection unreachable from anywhere else:
      # workflow_dispatch, a developer, a polecat and any future push-triggered
      # run all leave PKDUMP_CI_CHANGED_FILES unset, and ci.sh with no list runs
      # every tier. Nothing has to remember to ask for the full suite.
      #
      # (CI does not currently run on a push to master at all — master is
      # protected by a bypass-free ruleset, so every commit on it arrived
      # through a green PR. If a push trigger is ever added, this step's
      # condition is already the thing that keeps master unselectable.)
      #
      # Fail closed on every way this can go wrong: a base commit that is not
      # available, a diff that errors, an empty result. Each one leaves the
      # variable unset, and unset is the full suite.
      - name: Select CI tiers from the changed paths (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          list="${RUNNER_TEMP}/pkdump-ci-changed-files.txt"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base commit ${BASE_SHA} unavailable — running the FULL suite"
            exit 0
          fi
          # Two-dot against the base: actions/checkout leaves HEAD at the PR's
          # merge commit, so this is exactly the set of paths the PR changes.
          #
          # --no-renames so BOTH sides of a rename are listed. With rename
          # detection on, moving frontend/Thing.svelte to docs/thing.md reports
          # only the destination — which reads as a docs-only PR while the
          # frontend has lost a file. Listing the source too puts it back in the
          # frontend bucket, where it belongs.
          if ! git diff --no-renames --name-only "$BASE_SHA" HEAD > "$list"; then
            echo "git diff failed — running the FULL suite"
            exit 0
          fi
          if [ ! -s "$list" ]; then
            echo "no changed paths resolved — running the FULL suite"
            exit 0
          fi
          echo "changed paths:"
          sed 's/^/  /' "$list"
          echo "PKDUMP_CI_CHANGED_FILES=${list}" >> "$GITHUB_ENV"

      # The runner service is not a login shell, so nothing has sourced
      # ~/.cargo/env or the profile that adds ~/.local/bin. Both toolchains are
      # installed per-user on this box — cargo/rustc under ~/.cargo/bin, node/npm
      # under ~/.local/bin — so without this the very first gate dies with
      # `cargo: command not found`. (It did: the first run of this workflow.)
      #
      # $HOME-relative and via $GITHUB_PATH rather than a literal path in `env:`.
      # A hardcoded /home/<user> would put this one box's layout back into the
      # repo, which is the thing pd-rf7c took out.
      - name: Put the per-user toolchains on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail with a list of what is missing, rather than partway through gate 3
      # with whichever one happened to be reached first.
      - name: Check the toolchain is reachable
        run: |
          missing=""
          for t in cargo rustc node npm python3 podman sqlite3 curl; do
            command -v "$t" >/dev/null || missing="$missing $t"
          done
          [ -z "$missing" ] || { echo "not on PATH:$missing"; exit 1; }
          echo "toolchain OK: $(cargo --version), $(node --version), $(podman --version)"

      # ONE step, calling the same script a developer and a polecat run.
      #
      # Deliberately not decomposed into per-gate steps. Every drift bug this
      # repo has hit recently was a second copy of something going stale while
      # the first moved on — a test fixture that predated the bind refusal
      # (pd-z1xb), an alarming fixture that predated the registry (pd-nt1k). A
      # workflow that re-listed the gates would be exactly that shape: the list
      # here and the list in ci.sh drifting apart, with CI silently running fewer
      # gates than the polecats do.
      #
      # ci.sh prints its own `==> step` banners, so the log stays readable, and it
      # derives a per-checkout instance name and tears down via an EXIT trap, so
      # no cleanup step is needed here.
      #
      # PKDUMP_STORE_ROOT is deliberately NOT set: the runner executes as the same
      # user whose ~/.config/pkdump/store.env already points non-prod container
      # storage at the big disk, and ci.sh reads that file itself. Setting it here
      # would put the box's disk layout back into the repo, which is the thing
      # pd-rf7c removed.
      #
      # PKDUMP_CI_CHANGED_FILES arrives from $GITHUB_ENV when — and only when —
      # the step above set it. Unset means every tier; ci.sh prints the plan it
      # is running either way, so a PR log always states which tiers were
      # skipped and why.
      - name: deploy/ci.sh
        run: bash deploy/ci.sh

      # BELT AND BRACES: report this run as a commit status, whatever triggered it.
      #
      # GitHub creates one check suite per (commit, app). A `workflow_dispatch` run
      # creates that suite, so opening a PR on the same SHA afterwards produces no
      # new run and the PR shows NO CHECKS — the required `test` context reads as
      # missing rather than green, even though the commit WAS tested. On 2026-08-13
      # five of six open PRs were in that state and two had actually FAILED.
      #
      # A commit status has no such coupling: it attaches to the SHA and shows in the
      # merge box whatever triggered the run. Context is `test`, matching the check
      # run's name and the ruleset's required context, and it is posted with
      # GITHUB_TOKEN so it is attributed to the same github-actions app
      # (integration_id 15368) the ruleset names.
      #
      # `if: always()` because a FAILING run must post `failure`. A step that ran
      # only on success would leave a red run looking untested — worse than no
      # status at all.
      #
      # The SHA must be the PR HEAD, not github.sha: on a pull_request event
      # github.sha is the ephemeral merge commit, and a status there is invisible to
      # the merge box.
      - name: Report result as a commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context=test \
            -f target_url="${RUN_URL}" \
            -f description="deploy/ci.sh (${{ github.event_name }})" >/dev/null
          echo "posted commit status ${STATE} for ${SHA} (context: test)"
