name: CI

# deploy.yml has shipped to prod on every push to master since it was added, with
# nothing gating it. PR #7 merged and deployed without a single test having run in
# CI — the suite existed, but only ever as something a human or a polecat ran by
# hand. This is that gate.
#
# EACH RUN GETS ITS OWN MACHINE. The suite runs on a Proxmox VM cloned for this
# run and destroyed after it. The VM lifecycle is DeckDumpster/ephemeral-ci, the
# same two composite actions deckdumpster uses; what lives here is what runs ON
# the VM — deploy/runner-deps.sh and deploy/ci.sh.
#
# WHAT THAT CHANGED, because three comments in this file used to depend on the
# opposite. CI ran on one long-lived box, and that box being the only runner was
# load-bearing for a warm CARGO_TARGET_DIR, for a tree-hash cache on a host path,
# and for the serialisation that made a shared target directory safe at all. All
# three are gone with it:
#
#   - CARGO_TARGET_DIR / CARGO_HOME pointed at /workspaces on the old box. That
#     path does not exist here and every run compiles cold. The warning attached
#     to them — "two runs writing one target directory corrupts builds in ways
#     that present as flaky tests; BEFORE ADDING A SECOND RUNNER, move to sccache
#     or per-runner target dirs" — is now satisfied by construction rather than
#     by there happening to be one runner. Runs are isolated because they are on
#     different machines.
#
#   - The tree-hash cache keyed on /workspaces/ci-tree-cache. On a VM that has
#     never run anything, every lookup misses and every store evaporates, so the
#     steps were removed rather than left to log a miss they can never avoid.
#     deploy/ci-cache.sh stays for local use. If the cold build cost justifies it,
#     the warm caches belong baked into the Proxmox template, where each clone
#     gets a copy-on-write copy — isolated, unlike the shared directory they
#     replace.
#
#   - Runs no longer queue behind each other. Several PRs pushed together now get
#     several VMs.

on:
  pull_request:
    # BASE branches, not head. `[master]` alone meant that every PR an epic opens
    # into its own integration branch got NO CI AT ALL — the event simply never
    # matched, so there was no run to be queued, cancelled or approved.
    #
    # Six PRs (#31-#36, the lakehouse epic) sat like that on 2026-08-13. They read
    # as mergeable because the ruleset's required `test` check only guards master,
    # and an admin bypass reports CLEAN regardless. Two of them had in fact FAILED
    # their only evidence — a hand-run `workflow_dispatch`, which polecats had
    # reached for precisely because nothing else was firing.
    #
    # An epic's children are the reviewable unit (a polecat branch is the PR
    # source), so they have to be gated individually. Gating only the eventual
    # integration -> master PR hides a broken child until the whole epic lands.
    branches:
      - master
      - 'integration/**'
  workflow_dispatch:

# NO `concurrency:` BLOCK — deliberately, and now for a second reason.
#
# There was one (`group: pokedumpster-ci`, `cancel-in-progress: false`), and it was
# actively harmful. `cancel-in-progress: false` keeps the RUNNING job alive, but GitHub
# holds only ONE pending run per group: every newer arrival EVICTS the previous pending
# one. So several PRs pushed together do not queue — one runs, one waits, and the rest are
# silently CANCELLED.
#
# Measured 2026-08-13: six PRs pushed at 18:27-18:28 produced four cancelled runs
# (pd-up36, pd-nons, pd-aer9, pd-kncd). Not failures — cancellations, which look identical
# to "not started yet" in the UI. Someone had to push a "Retrigger CI" commit by hand.
#
# It was also redundant when there was exactly one runner, which serialised jobs FIFO.
# There is no longer one runner: each run provisions its own VM, so runs are genuinely
# concurrent and a group here would start evicting them again.

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      vmid: ${{ steps.vm.outputs.vmid }}
      label: ${{ steps.vm.outputs.label }}
    steps:
      - uses: DeckDumpster/ephemeral-ci/provision@v1
        id: vm
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-node:           ${{ vars.PVE_NODE }}
          template-vmid:      ${{ vars.TEMPLATE_VMID }}

  # NAMED `gate` BECAUSE THAT NAME IS A CONTRACT WITH SPIRA. Spira's merge queue
  # reads the status-check rollup for an entry whose name is exactly `gate`; the
  # check-run name follows the job name, which is the half Spira reads.
  #
  # The commit status step below posts BOTH `gate` and `test`. `test` stays for
  # the duration of the transition to queue mode: the `pr-required` ruleset on
  # master requires a status check called `test`, and dropping it before the
  # ruleset is updated would block every PR indefinitely — a required check that
  # never reports does not fail the PR, it prevents the merge box from going green.
  gate:
    needs: [provision]
    runs-on: [self-hosted, "${{ needs.provision.outputs.label }}"]
    # statuses:write for the final step, which posts this run's result as a COMMIT
    # STATUS. The repo default is read-only (default_workflow_permissions=read), so
    # without this the POST 403s and the belt-and-braces below silently does
    # nothing — the exact failure mode it exists to prevent.
    permissions:
      contents: read
      statuses: write
    # The suite builds a container, drives Playwright over every route at two
    # viewports, and executes two DR drills against a throwaway MinIO. It is not
    # a two-minute job, and it now also compiles Rust from cold.
    timeout-minutes: 90
    # NO `XDG_RUNTIME_DIR` HERE, DELIBERATELY.
    #
    # It used to be pinned to /run/user/1000, which was true of the one box CI
    # ran on and is a fact about that box, not about this repository. On the
    # ephemeral VM the runner user is not uid 1000, so podman answered every
    # call with
    #
    #     Failed to obtain podman configuration:
    #     lstat /run/user/1000: no such file or directory
    #
    # and six assertions in the container-store gate failed as though the store
    # split were broken. A job-level `env:` OVERRIDES the script, so ci.sh's own
    # `${XDG_RUNTIME_DIR:-/run/user/$(id -u)}` default — which is correct on any
    # box — never got a chance to apply. Leaving it unset is what lets it.
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 so the PR's base commit is present locally and the
          # changed-path list below can be computed without a second network
          # round trip. On a fresh VM this is a full clone every time; it is
          # still cheaper than fetching the base separately and then failing
          # open to the whole suite when it is unavailable.
          fetch-depth: 0

      - name: Confirm the job landed on the ephemeral VM
        run: test "$RUNNER_NAME" = "${{ needs.provision.outputs.label }}"

      # THE TOOLCHAIN IS INSTALLED, NOT ASSUMED. This replaces two steps that
      # only ever worked on one box: one that prepended ~/.cargo/bin and
      # ~/.local/bin to PATH (added because the very first run of this workflow
      # died with `cargo: command not found`), and one that checked a list of
      # commands were reachable. Both encoded the dependency list somewhere
      # nothing else could read. deploy/runner-deps.sh is that list, executable,
      # and it re-checks itself after installing — so a partial install fails
      # here rather than three gates into ci.sh on a machine that is about to
      # stop existing.
      - name: Install runner dependencies
        run: bash deploy/runner-deps.sh

      # Tier selection (pd-s2mj). Which tiers ci.sh runs is decided from the
      # paths this PR touched — docs-only runs the lint tier, a change confined
      # to frontend/ runs frontend + container + browser, and ANYTHING ELSE runs
      # the whole suite. deploy/ci-select.sh holds the rule and explains why it
      # is shaped to fail closed.
      #
      # PULL REQUESTS ONLY, and that is the load-bearing part of this step. The
      # `if:` is what makes selection unreachable from anywhere else:
      # workflow_dispatch, a developer, a polecat and any future push-triggered
      # run all leave PKDUMP_CI_CHANGED_FILES unset, and ci.sh with no list runs
      # every tier. Nothing has to remember to ask for the full suite.
      #
      # Fail closed on every way this can go wrong: a base commit that is not
      # available, a diff that errors, an empty result. Each one leaves the
      # variable unset, and unset is the full suite.
      - name: Select CI tiers from the changed paths (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          list="${RUNNER_TEMP}/pkdump-ci-changed-files.txt"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base commit ${BASE_SHA} unavailable — running the FULL suite"
            exit 0
          fi
          # Two-dot against the base: actions/checkout leaves HEAD at the PR's
          # merge commit, so this is exactly the set of paths the PR changes.
          #
          # --no-renames so BOTH sides of a rename are listed. With rename
          # detection on, moving frontend/Thing.svelte to docs/thing.md reports
          # only the destination — which reads as a docs-only PR while the
          # frontend has lost a file. Listing the source too puts it back in the
          # frontend bucket, where it belongs.
          if ! git diff --no-renames --name-only "$BASE_SHA" HEAD > "$list"; then
            echo "git diff failed — running the FULL suite"
            exit 0
          fi
          if [ ! -s "$list" ]; then
            echo "no changed paths resolved — running the FULL suite"
            exit 0
          fi
          echo "changed paths:"
          sed 's/^/  /' "$list"
          echo "PKDUMP_CI_CHANGED_FILES=${list}" >> "$GITHUB_ENV"

      # ONE step, calling the same script a developer and a polecat run.
      #
      # Deliberately not decomposed into per-gate steps. Every drift bug this
      # repo has hit recently was a second copy of something going stale while
      # the first moved on — a test fixture that predated the bind refusal
      # (pd-z1xb), an alarming fixture that predated the registry (pd-nt1k). A
      # workflow that re-listed the gates would be exactly that shape: the list
      # here and the list in ci.sh drifting apart, with CI silently running fewer
      # gates than the polecats do.
      #
      # ci.sh prints its own `==> step` banners, so the log stays readable, and it
      # derives a per-checkout instance name and tears down via an EXIT trap, so
      # no cleanup step is needed here.
      #
      # PKDUMP_STORE_ROOT is deliberately NOT set: ci.sh reads
      # ~/.config/pkdump/store.env itself where one exists, and on a VM with a
      # single disk there is no non-prod store to separate anything from.
      #
      # PKDUMP_CI_CHANGED_FILES arrives from $GITHUB_ENV when — and only when —
      # the step above set it. Unset means every tier; ci.sh prints the plan it
      # is running either way, so a PR log always states which tiers were
      # skipped and why.
      - name: deploy/ci.sh
        run: bash deploy/ci.sh

      # BELT AND BRACES: report this run as commit statuses, whatever triggered it.
      #
      # GitHub creates one check suite per (commit, app). A `workflow_dispatch` run
      # creates that suite, so opening a PR on the same SHA afterwards produces no
      # new run and the PR shows NO CHECKS — the required `test` context reads as
      # missing rather than green, even though the commit WAS tested. On 2026-08-13
      # five of six open PRs were in that state and two had actually FAILED.
      #
      # A commit status has no such coupling: it attaches to the SHA and shows in the
      # merge box whatever triggered the run. Two contexts are posted:
      #
      #   gate  — Spira's merge queue reads this. The check-run name (`gate`, from
      #           the job name) is one signal; the commit status is what survives a
      #           workflow_dispatch that precedes a PR.
      #   test  — the `pr-required` ruleset on master requires this context during
      #           the transition to queue mode. Drop it before the ruleset is updated
      #           and every PR blocks indefinitely: a required check that never
      #           reports does not FAIL the PR, it prevents the merge box going green.
      #
      # `if: always()` because a FAILING run must post `failure`. A step that ran
      # only on success would leave a red run looking untested — worse than no
      # status at all.
      #
      # The SHA must be the PR HEAD, not github.sha: on a pull_request event
      # github.sha is the ephemeral merge commit, and a status there is invisible to
      # the merge box.
      - name: Report result as commit statuses (gate and test)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # curl, not `gh`. The GitHub CLI is not installed on the ephemeral VM and
        # is not worth installing for two POSTs: this step died with
        # `gh: command not found` (exit 127) on the first cold run, AFTER the
        # suite had already produced its verdict — so the run that was supposed
        # to be reported was the one whose reporting failed. curl is already a
        # required dependency.
        #
        # --fail-with-body so an HTTP error is an error here and not a silent
        # 200-shaped success; without it a 403 from a read-only token would
        # print a JSON error and exit 0, which is precisely the failure mode
        # this whole step exists to prevent.
        run: |
          for context in gate test; do
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${{ github.repository }}/statuses/${SHA}" \
              -d "$(printf '{"state":"%s","context":"%s","target_url":"%s","description":"deploy/ci.sh (%s)"}' \
                    "$STATE" "$context" "$RUN_URL" "${{ github.event_name }}")" >/dev/null
            echo "posted commit status ${STATE} for ${SHA} (context: ${context})"
          done

  # if: always() is load-bearing. A cancelled or failed run otherwise leaves the
  # VM running, and the hourly reaper in DeckDumpster/ephemeral-ci becomes the
  # only thing that cleans up — which is a backstop, not a plan.
  teardown:
    needs: [provision, gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: DeckDumpster/ephemeral-ci/teardown@v1
        with:
          vmid:  ${{ needs.provision.outputs.vmid }}
          label: ${{ needs.provision.outputs.label }}
          runner-reg-pat:     ${{ secrets.RUNNER_REG_PAT }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          pve-token-id:       ${{ secrets.PVE_TOKEN_ID }}
          pve-token-secret:   ${{ secrets.PVE_TOKEN_SECRET }}
          pve-api-host:       ${{ vars.PVE_API_HOST }}
          pve-node:           ${{ vars.PVE_NODE }}
