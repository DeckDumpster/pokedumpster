[package]
name = "pkdump-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
pkdump-db.workspace = true
pkdump-ingest.workspace = true
pkdump-lake.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The landing-half gates open a directory-backed lake and read the catalog back.
pkdump-lake.workspace = true
rusqlite.workspace = true
# Needed to build a minimal valid bulk tarball for the fake upstream in tail_failure tests.
flate2.workspace = true
tar.workspace = true
# tail_failure.rs pulls in pkdump-ingest/tests/support/mod.rs by path, which
# re-exports from pkdump_ingest::test_upstream — that module is gated behind
# the test-support feature and is absent without it.
pkdump-ingest = { workspace = true, features = ["test-support"] }
