# Scenario: A facet link clicked inside the card modal widens to All cards live
#
# Related:
#   issues: [pokedumpster-ozm, pokedumpster-xj6]
#   pull_requests: []

description: >
  When I open a card's modal on the collection page and click a facet link
  that carries "All cards" (e.g. the Pokédex number), the results widen to
  the whole catalog immediately — unowned matches appear as dimmed tiles —
  with no page reload. This guards a regression where a client-side facet
  navigation updated the query but left the "All cards" toggle owned-only
  until the page was manually reloaded.
