# Scenario: Empty state message when no decks exist
#
# Prerequisites:
#   All three fixture decks are deleted before loading the page

description: >
  When I visit /decks on an instance with no decks, I see the message
  "No decks yet. Create one above." instead of a deck grid. The inline
  create form is still available above the message. To reach this state,
  I first delete all three existing fixture decks, then reload the page.
