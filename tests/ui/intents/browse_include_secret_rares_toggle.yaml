# Scenario: The Secret checkbox includes or excludes the secret-rare section

# Related: browse_secret_rares_appended_after_numbered, browse_include_subset_toggle, browse_include_promos_toggle

description: >
  On the "151" binder browse page the "Secret" checkbox is checked by
  default, so the trailing "Secret Rares" section is visible and the Mew ex
  hyper-rare slot (#201) appears after the numbered cards. I uncheck "Secret";
  the page resets to "Page 1 of N", the "Secret Rares" divider disappears, and
  the Mew ex slot is no longer in the grid. I re-check "Secret" and the secret
  section comes back.
