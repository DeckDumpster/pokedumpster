name: CI

# deploy.yml has shipped to prod on every push to master since it was added, with
# nothing gating it. PR #7 merged and deployed without a single test having run in
# CI — the suite existed, but only ever as something a human or a polecat ran by
# hand. This is that gate.
#
# Modelled on deckdumpster's .github/workflows/ci.yml, same box, same runner
# label, so the two repos work the same way.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# ONE pokedumpster CI run at a time, box-wide.
#
# Rootless Podman keeps a single per-user store, and deploy/ci.sh runs
# `podman image prune` and builds into it. Two concurrent runs sharing that store
# is a real, observed failure: the litestream gate died with a bare `exit 127` and
# an empty log, twice, both times with another deploy/ci.sh running (pd-8gjs).
#
# The group is a constant rather than ${{ github.ref }} — per-ref would still let
# two different PRs collide, which is the case that actually bit. cancel-in-progress
# is false because a queued run should WAIT for the store, not kill the run holding
# it.
#
# What this does NOT cover, so nobody reads it as a guarantee: Gas Town polecats
# run ci.sh outside Actions entirely, and nothing here can see them.
#
# It also does not decide whether deploys wait. There is ONE self-hosted runner for
# this repo, so every job serialises on it regardless of concurrency groups —
# measured 2026-08-09: a Deploy sat `queued` for the ~24 minutes a CI run held the
# runner. deploy.yml keeps its own `deploy-<instance>` group purely to stop two
# deploys of one instance racing; it has no bearing on CI. Accepted deliberately
# while CI and prod share a host (per Ryan, 2026-08-09) — revisit when they are
# split, at which point a second runner is the fix, not a concurrency change.
#
# AND SINCE pd-uikc, SOMETHING ELSE RESTS ON THIS GROUP:
#
#   ##########################################################################
#   # CARGO_TARGET_DIR is shared across runs because ci.yml serialises every #
#   # job on one concurrency group and there is exactly one self-hosted      #
#   # runner. Adding a second runner without moving to sccache (or           #
#   # per-runner target dirs) means two runs writing one target directory,   #
#   # which corrupts builds in ways that look like flaky tests.              #
#   ##########################################################################
#
# So the paragraph above has a second reading now. "A second runner is the fix"
# for the deploy-waits-for-CI problem is still true, but a second runner is no
# longer a pure win: it also takes out the warm build cache, and it takes it out
# in the worst possible way — not with an error, but with intermittent nonsense
# from a half-written target directory. sccache was weighed and DECIDED AGAINST
# while no second runner is planned (per Ryan, 2026-08-12); it is what a second
# runner would need first. See the CARGO_TARGET_DIR step below.
concurrency:
  group: pokedumpster-ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, rgantt]
    # The suite builds a container, drives Playwright over every route at two
    # viewports, and executes two DR drills against a throwaway MinIO. It is not
    # a two-minute job; the default 360m is just too loose to catch a hang.
    timeout-minutes: 60
    env:
      # Rootless podman and `systemctl --user` need this; a non-login runner
      # process does not get it for free.
      XDG_RUNTIME_DIR: /run/user/1000
    steps:
      - uses: actions/checkout@v4

      # The runner service is not a login shell, so nothing has sourced
      # ~/.cargo/env or the profile that adds ~/.local/bin. Both toolchains are
      # installed per-user on this box — cargo/rustc under ~/.cargo/bin, node/npm
      # under ~/.local/bin — so without this the very first gate dies with
      # `cargo: command not found`. (It did: the first run of this workflow.)
      #
      # $HOME-relative and via $GITHUB_PATH rather than a literal path in `env:`.
      # A hardcoded /home/<user> would put this one box's layout back into the
      # repo, which is the thing pd-rf7c took out.
      - name: Put the per-user toolchains on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail with a list of what is missing, rather than partway through gate 3
      # with whichever one happened to be reached first.
      - name: Check the toolchain is reachable
        run: |
          missing=""
          for t in cargo rustc node npm python3 podman sqlite3 curl; do
            command -v "$t" >/dev/null || missing="$missing $t"
          done
          [ -z "$missing" ] || { echo "not on PATH:$missing"; exit 1; }
          echo "toolchain OK: $(cargo --version), $(node --version), $(podman --version)"

      # --- Warm the Rust build (pd-uikc) ---------------------------------------
      #
      # actions/checkout runs `git clean -ffdx`, so a `target/` inside the
      # checkout is deleted before cargo ever sees it. Every run compiled all 352
      # dependency crates from cold, and then did most of it AGAIN because clippy
      # checks what test had just built: 240s + 108s of the 1844s measured on run
      # 31612843925. The runner is self-hosted and the machine persists, so the
      # target directory goes OUTSIDE the checkout, where the clean cannot reach
      # it, and the second run over the same code compiles nothing.
      #
      # That is the whole of the caching, deliberately. ~/.cargo/registry and
      # ~/.cargo/git are ALREADY persistent, for the same reason and by the same
      # mechanism — one user, one box, and nothing here sets CARGO_HOME — which is
      # why there is no actions/cache step for them: on a self-hosted runner that
      # would tar half a gigabyte up and down each run to reconstruct a directory
      # that never went anywhere. What the repo owes them is not a cache action
      # but the discipline of not breaking them, so the step below prints both and
      # the run says WARM or COLD out loud.
      #
      #   ##########################################################################
      #   # CARGO_TARGET_DIR is shared across runs because ci.yml serialises every #
      #   # job on one concurrency group and there is exactly one self-hosted      #
      #   # runner. Adding a second runner without moving to sccache (or           #
      #   # per-runner target dirs) means two runs writing one target directory,   #
      #   # which corrupts builds in ways that look like flaky tests.              #
      #   ##########################################################################
      #
      # WHERE IT LIVES. $HOME/.cache is where a rebuildable cache belongs and it
      # says nothing about any particular machine, so it is the default; a literal
      # /workspaces/... here would put this one box's disk layout back into the
      # repo, which is exactly what pd-rf7c took out. Where that is the wrong
      # filesystem, name another directory in ~/.config/pkdump/ci.env — the
      # host-config directory store.env and alerts.env already live in. (On the
      # box this runs on, ~/.cache is already a symlink onto the 938G data disk,
      # so the default lands off prod's disk without anyone configuring anything.)
      #
      # It grows without bound: cargo never collects an artifact for a dependency
      # version nothing depends on any more. Hence the size in the report below.
      # Deleting the directory is always safe and costs exactly one cold build.
      - name: Point cargo at the persistent target directory
        run: |
          conf="$HOME/.config/pkdump/ci.env"
          # shellcheck source=/dev/null
          [ -f "$conf" ] && { set -a; . "$conf"; set +a; }
          dir="${PKDUMP_CI_CARGO_TARGET_DIR:-$HOME/.cache/pkdump/ci-cargo-target}"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      # Warm or cold as a number, printed before anything compiles, because "the
      # cache is working" is otherwise only visible as an absence of minutes and
      # nobody reads a log for those. COLD is correct exactly once — the first run
      # after a toolchain bump, a Cargo.lock change wide enough to evict the world,
      # or a manual delete. COLD on a run whose predecessor was WARM means the
      # directory is not surviving and the ~6 minutes are quietly back.
      - name: Report the build cache
        run: |
          echo "CARGO_TARGET_DIR = $CARGO_TARGET_DIR"
          if [ -d "$CARGO_TARGET_DIR/debug" ]; then
            rmeta=$(find "$CARGO_TARGET_DIR/debug/deps" -name '*.rmeta' 2>/dev/null | wc -l)
            echo "  target dir     : WARM ($(du -sh "$CARGO_TARGET_DIR" | cut -f1), ${rmeta} rmeta)"
          else
            echo "  target dir     : COLD (nothing to reuse — this run compiles from scratch)"
          fi
          echo "  CARGO_HOME     = ${CARGO_HOME:-<unset, so $HOME/.cargo — keep it that way>}"
          echo "  cargo registry : $(du -sh "${CARGO_HOME:-$HOME/.cargo}/registry" 2>/dev/null | cut -f1 || echo 'absent (cold)')"

      # ONE step, calling the same script a developer and a polecat run.
      #
      # Deliberately not decomposed into per-gate steps. Every drift bug this
      # repo has hit recently was a second copy of something going stale while
      # the first moved on — a test fixture that predated the bind refusal
      # (pd-z1xb), an alarming fixture that predated the registry (pd-nt1k). A
      # workflow that re-listed the gates would be exactly that shape: the list
      # here and the list in ci.sh drifting apart, with CI silently running fewer
      # gates than the polecats do.
      #
      # ci.sh prints its own `==> step` banners, so the log stays readable, and it
      # derives a per-checkout instance name and tears down via an EXIT trap, so
      # no cleanup step is needed here.
      #
      # PKDUMP_STORE_ROOT is deliberately NOT set: the runner executes as the same
      # user whose ~/.config/pkdump/store.env already points non-prod container
      # storage at the big disk, and ci.sh reads that file itself. Setting it here
      # would put the box's disk layout back into the repo, which is the thing
      # pd-rf7c removed.
      - name: deploy/ci.sh
        run: bash deploy/ci.sh
