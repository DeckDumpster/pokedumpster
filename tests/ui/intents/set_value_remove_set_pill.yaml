# Scenario: Set Stats reloads when the set route param changes
#
# Related:
#   pages: [set-stats]

description: >
  The Set Stats page re-fetches its analytics whenever the set route
  param changes. Loading /browse/sv3pt5/stats shows the "151" dashboard;
  navigating to /browse/sv8/stats re-runs the analytics and the heading,
  Completion card, and Rarity split table all update to Surging Sparks.
