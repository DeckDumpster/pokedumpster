[package]
name = "pkdump-lakehouse"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pkdump-lake-derive"
path = "src/main.rs"

[dependencies]
pkdump-db.workspace = true
pkdump-derive.workspace = true
pkdump-ingest.workspace = true
pkdump-lake.workspace = true
rusqlite.workspace = true
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true

[dev-dependencies]
# row_identical.rs pulls in pkdump-ingest/tests/support/mod.rs by path, which
# re-exports from pkdump_ingest::test_upstream — that module is gated behind
# the test-support feature and is absent without it.
pkdump-ingest = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
image.workspace = true
zstd.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tar.workspace = true
flate2.workspace = true
