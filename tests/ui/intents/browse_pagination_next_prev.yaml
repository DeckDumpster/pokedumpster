# Scenario: Paging through a set with the Prev and Next buttons

# Related: browse_loads_set_first_page, browse_layout_toggle_9_to_4, browse_url_state_persists

description: >
  On the "151" binder browse page the indicator reads "Page 1 of N" and the
  "← Prev" button is disabled. I click "Next →"; the indicator advances to
  "Page 2 of N", a new set of card slots loads, and "← Prev" becomes enabled.
  I click "← Prev"; the indicator returns to "Page 1 of N" and the "← Prev"
  button is disabled again. On the last page the "Next →" button is disabled.
