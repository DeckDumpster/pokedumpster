# Scenario: Subset cards render in their own appended section

# Related: browse_include_subset_toggle, browse_secret_rares_appended_after_numbered

description: >
  On a binder browse page, with the "Subset" checkbox on, cards flagged as a
  subset (such as a Galaxy or Trainer Gallery sub-collection) render as a
  separate appended section. After the numbered set — and after any secret
  rares — a full-width "Subset" divider appears, followed by the subset slots.
  Subset cards are never interleaved with the main numbered run.
