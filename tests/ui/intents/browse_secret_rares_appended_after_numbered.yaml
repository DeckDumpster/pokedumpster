# Scenario: Secret rares render in a trailing section after the numbered set

# Related: browse_include_secret_rares_toggle, browse_subset_section_appended

description: >
  On the "151" binder browse page, with the "Secret" checkbox on, the
  numbered cards (#1 through #165) come first in set-number order. After the
  last numbered card a full-width "Secret Rares" divider appears, followed by
  the secret-rare slots — for the 151 set this is Mew ex #201, whose number
  exceeds the set's printed total of 165. The secret rares are always placed
  after the numbered set, never interleaved.
