[workspace]
resolver = "2"
members = [
    "crates/pkdump-cli",
    "crates/pkdump-core",
    "crates/pkdump-db",
    "crates/pkdump-derive",
    "crates/pkdump-ingest",
    "crates/pkdump-keys",
    "crates/pkdump-lake",
    "crates/pkdump-lakehouse",
    "crates/pkdump-server",
    "crates/pkdump-ship",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Ryan Gantt"]
repository = "https://github.com/DeckDumpster/pokedumpster"

[workspace.dependencies]
# Internal crates
pkdump-core = { path = "crates/pkdump-core" }
pkdump-db = { path = "crates/pkdump-db" }
pkdump-derive = { path = "crates/pkdump-derive" }
pkdump-ingest = { path = "crates/pkdump-ingest" }
pkdump-keys = { path = "crates/pkdump-keys" }
pkdump-lake = { path = "crates/pkdump-lake" }
pkdump-server = { path = "crates/pkdump-server" }
pkdump-ship = { path = "crates/pkdump-ship" }

# External — crates opt in via `dep.workspace = true` as tasks need them
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ts-rs = "10"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
flate2 = "1"
brotli = "8"
tar = "0.4"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ulid = { version = "3", default-features = false, features = ["std"] }
# Raw landing zone (pkdump-lake). zstd is the archive codec the lakehouse design
# names for `raw/` — a different question from HTTP response compression, where
# pkdump-server deliberately stayed on br/gzip (see its `compression()`).
zstd = "0.13"
sha2 = "0.10"
# Key custody (pkdump-keys). HKDF-SHA256 is the whole of the derivation — one
# master key, per-tenant keys derived from it, nothing stored per tenant. The
# RustCrypto `hkdf` crate rather than a hand-rolled HMAC ladder: RFC 5869 is
# easy to get subtly wrong and this is the one place in the codebase where
# subtly wrong is unrecoverable.
hkdf = "0.12"
getrandom = "0.3"
hex = "0.4"
zeroize = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
# The shipper (pkdump-ship). Parquet without arrow: the tenant zone is plain
# partitioned Parquet, and the low-level column writer is all a five-column
# append-only batch needs — `default-features = false` keeps the whole arrow
# stack out of a workspace that has no other use for it.
parquet = { version = "59", default-features = false, features = ["zstd"] }
# AES-256-GCM for the tenant zone's objects. RustCrypto again, for the reason
# `hkdf` is: this is the second place where subtly wrong is unrecoverable.
aes-gcm = "0.11"
bytes = "1"

[profile.release]
strip = true
lto = "thin"
